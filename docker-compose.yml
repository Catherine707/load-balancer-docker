version: "3.8"

services:

  server1:
    image: nginx:latest
    volumes:
      - ./server1:/usr/share/nginx/html

  server2:
    image: nginx:latest
    volumes:
      - ./server2:/usr/share/nginx/html

  loadbalancer:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - server1
      - server2
